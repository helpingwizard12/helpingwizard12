<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Tanish Charthankar</title><desc id="desc">Engineer at Atlan. I want to get faster without getting shallow.</desc><rect width="1200" height="390" fill="#f5f3ed"/><text x="52" y="90" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="76" fill="#242b2b">Tanish</text><text x="52" y="172" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="76" fill="#242b2b">Charthankar.</text><text x="57" y="291" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#67736c">Engineer at Atlan</text><text x="731" y="126" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="32" fill="#242b2b">I want to get faster</text><text x="731" y="171" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="32" fill="#242b2b">without getting</text><text x="731" y="216" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="32" fill="#a84d2f">shallow.</text><polyline points="54,351 1146,351" fill="none" stroke="#c4cbc3" stroke-width="1"/><text x="56" y="365" dominant-baseline="text-before-edge" font-family="monospace" font-size="11" fill="#67736c">SLEEP DEPRIVED DREAMER</text><text x="1080" y="365" dominant-baseline="text-before-edge" font-family="monospace" font-size="11" fill="#67736c">TC /</text></svg>