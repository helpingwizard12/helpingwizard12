<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Tanish Charthankar</title><desc id="desc">Engineer at Atlan. I want to get faster without getting shallow.</desc><rect width="1200" height="390" fill="#171c20"/><text x="52" y="90" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="76" fill="#e9e7df">Tanish</text><text x="52" y="172" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="76" fill="#e9e7df">Charthankar.</text><text x="57" y="291" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" fill="#a0aaa6">Engineer at Atlan</text><text x="731" y="126" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="32" fill="#e9e7df">I want to get faster</text><text x="731" y="171" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="32" fill="#e9e7df">without getting</text><text x="731" y="216" dominant-baseline="text-before-edge" font-family="Georgia, serif" font-size="32" fill="#dc8056">shallow.</text><polyline points="54,351 1146,351" fill="none" stroke="#505b57" stroke-width="1"/><text x="56" y="365" dominant-baseline="text-before-edge" font-family="monospace" font-size="11" fill="#a0aaa6">SLEEP DEPRIVED DREAMER</text><text x="1080" y="365" dominant-baseline="text-before-edge" font-family="monospace" font-size="11" fill="#a0aaa6">TC /</text></svg>